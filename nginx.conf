server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is recharts-heavy and was shipped uncompressed until now — the
    # single largest win available on a phone connection. text/html is gzipped by
    # default; everything else has to be named.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Baseline security headers. The API sets its own on every response; these
    # cover the static origin, which is where the app itself is served from.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # index.html must NOT be cached, and it pairs with the rule below: hashed
    # assets are immutable for a year, and index.html is the only unhashed file,
    # so a stale copy pins a browser to asset names from a previous deploy. Those
    # then 404 and the app is a blank page until a hard reload.
    #
    # Declared before the extension rule because nginx matches an exact `=`
    # location first regardless of order — but keeping it first also stops the
    # next reader wondering.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Same reasoning: the worker scripts and the manifest decide what the
    # installed app loads, so a cached copy outlives the deploy that replaced it.
    location ~* ^/(sw\.js|push-sw\.js|outbox-sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Hashed filenames, so a year is safe and `immutable` stops even a
    # revalidation request. add_header does not inherit into a location that
    # declares its own, hence the repetition.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # All other routes handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
